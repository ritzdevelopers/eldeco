<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Eldeco | Oxy-Rich Luxury Residences</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                screens: {
                    'xs': '375px',
                    'sm': '640px',
                    'md': '768px',
                    'lg': '1024px',
                    'xl': '1280px',
                    '2xl': '1536px',
                },
                extend: {
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                        opensans: ['Open Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="antialiased overflow-x-hidden min-w-0 bg-white">
    <!-- Thank You Section -->
    <main class="w-full min-h-screen flex items-center justify-center px-3 xs:px-4 sm:px-6 md:px-12 lg:px-16 py-20 xs:py-24 sm:py-28 md:py-32 lg:py-40">
        <div class="w-full max-w-2xl mx-auto text-center">
            <!-- Success Icon -->
            <div class="mb-6 xs:mb-8 sm:mb-10 flex justify-center">
                <div class="w-20 h-20 xs:w-24 xs:h-24 sm:w-28 sm:h-28 rounded-full bg-gradient-to-r from-[#976431] to-[#b28254] flex items-center justify-center shadow-lg">
                    <svg class="w-10 h-10 xs:w-12 xs:h-12 sm:w-14 sm:h-14 text-white" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
            </div>

            <!-- Thank You Message -->
            <h1
                class="text-[#000000] text-2xl xs:text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold font-montserrat mb-4 xs:mb-5 sm:mb-6">
                Thank You!
            </h1>
            <p
                class="text-[#000000] text-base xs:text-lg sm:text-xl md:text-2xl font-opensans mb-6 xs:mb-8 sm:mb-10 leading-relaxed">
                We have received your request. Our team will get back to you shortly.
            </p>

            <!-- Countdown Timer Section -->
            <div class="mb-8 xs:mb-10 sm:mb-12">
                <div class="inline-flex flex-col items-center gap-3 xs:gap-4 bg-[#FFF5EB] rounded-[10px] px-6 xs:px-8 sm:px-10 py-5 xs:py-6 sm:py-8 border border-[#FADEC3]">
                    <p class="text-[#000000] text-sm xs:text-base sm:text-lg font-opensans font-[600] mb-2">
                        You will be redirected automatically in
                    </p>
                    <div class="flex items-center gap-2">
                        <span id="countdown"
                            class="text-[#976431] text-3xl xs:text-4xl sm:text-5xl md:text-6xl font-bold font-montserrat">
                            7
                        </span>
                        <span class="text-[#000000] text-lg xs:text-xl sm:text-2xl font-opensans">seconds</span>
                    </div>
                </div>
            </div>

            <!-- Manual Go Back Button -->
            <div class="flex flex-col sm:flex-row gap-4 xs:gap-5 justify-center items-center">
                <button id="goBackBtn" onclick="goBack()"
                    class="btn-overview-solid inline-flex items-center justify-center gap-2 text-white font-montserrat font-semibold text-[14px] xs:text-[15px] sm:text-[16px] px-6 xs:px-8 sm:px-10 py-3 xs:py-3.5 sm:py-4 rounded-[5px] transition-all hover:opacity-95 shadow-sm w-full sm:w-auto">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Go Back
                </button>
                <a href="index.html"
                    class="inline-flex items-center justify-center gap-2 text-[#000000] font-montserrat font-semibold text-[14px] xs:text-[15px] sm:text-[16px] px-6 xs:px-8 sm:px-10 py-3 xs:py-3.5 sm:py-4 rounded-[5px] border border-[#A27140] bg-white transition-all hover:bg-[#976431]/5 w-full sm:w-auto">
                    Return to Home
                </a>
            </div>
        </div>
    </main>


    <script>
        // Store the previous URL - check sessionStorage first, then referrer
        let previousUrl = sessionStorage.getItem('previousUrl') || document.referrer || 'index.html';
        
        // Clean up sessionStorage after getting the URL
        sessionStorage.removeItem('previousUrl');
        
        // Countdown timer
        let countdown = 7;
        const countdownElement = document.getElementById('countdown');
        
        // Update countdown every second
        const countdownInterval = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(countdownInterval);
                redirectToPrevious();
            }
        }, 1000);
        
        // Function to redirect to previous page
        function redirectToPrevious() {
            // Check if previousUrl is valid and not the current page
            if (previousUrl && previousUrl !== window.location.href && previousUrl.includes(window.location.origin)) {
                window.location.href = previousUrl;
            } else if (previousUrl && previousUrl !== window.location.href) {
                // If it's a relative URL
                window.location.href = previousUrl;
            } else {
                // Fallback to index.html
                window.location.href = 'index.html';
            }
        }
        
        // Function to go back manually
        function goBack() {
            clearInterval(countdownInterval);
            redirectToPrevious();
        }
        
        // Handle browser back button
        window.addEventListener('popstate', () => {
            clearInterval(countdownInterval);
        });
    </script>
</body>

</html>
